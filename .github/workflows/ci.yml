name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  server:
    name: Server & MCP bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use crates.io on CI
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: cargo build --locked --release --manifest-path server/Cargo.toml
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
        env:
          AI_EMAIL_TEST_BINARY: ${{ github.workspace }}/server/target/release/ai-email-server
      - uses: actions/upload-artifact@v7
        with:
          name: ai-email-server-linux-x64
          path: server/target/release/ai-email-server

  native-android:
    name: Native Android Search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint and build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ai-email-native-search-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  native-macos:
    name: Native macOS Search
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check native client behavior and build macOS app
        run: swift run --package-path macos MailSearchChecks && bash scripts/build-macos-search.sh
      - name: Archive app preserving executable permissions
        run: tar -czf macos/build/AI-Email-macos.tar.gz -C macos/build 'AI Email.app'
      - uses: actions/upload-artifact@v7
        with:
          name: ai-email-native-macos
          path: macos/build/AI-Email-macos.tar.gz
          if-no-files-found: error
